name: probe4
on: workflow_dispatch
permissions: {}
jobs:
  p4:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node probe4.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: results4
          path: results4.json
          if-no-files-found: warn
